<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Split-flap card background -->
  <rect x="2" y="2" width="28" height="28" rx="3" fill="#1a1a1a" stroke="#374151" stroke-width="1.5"/>
  <!-- Horizontal split line -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#0d0d0d" stroke-width="1"/>
  <!-- Clock face -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#f0f0f0" stroke-width="1.5"/>
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="16" y2="10" stroke="#f0f0f0" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="21" y2="13" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#f5a623"/>
</svg>
